site_name: CINEI Documentation
site_description: Coupled and Integrated Emission Inventory for China
site_author: Yijuan Zhang
site_url: https://luyikeka.github.io/cinei/

repo_name: Luyikeka/cinei
repo_url: https://github.com/Luyikeka/cinei

theme:
  name: material
  palette:
    - scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

nav:
  - Home: index.md
  - Getting Started:
    - Installation: guide/installation.md
    - Quick Start: guide/quickstart.md
  - Data Download:
    - Overview: guide/data_overview.md
    - CEDS: guide/download_ceds.md
    - MEIC: guide/download_meic.md
    - HTAP: guide/download_htap.md
    - EDGAR: guide/download_edgar.md
  - Preprocessing: guide/preprocess.md
  - Tutorial:
    - Basic Workflow: tutorial/basic_workflow.md
  - API Reference:
    - emis_union: api/core.md
    - download: api/download.md
    - utils: api/utils.md
    - visualization: api/visualization.md
    - preprocess: api/preprocess.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Luyikeka/cinei
    - icon: fontawesome/solid/envelope
      link: mailto:yijuancham@gmail.com
